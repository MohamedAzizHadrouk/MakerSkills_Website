name: Deploy Maker Skills

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: makerskills-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          # Operate ONLY inside Maker Skills — never /home/ubuntu/rondeguard
          script: |
            set -euo pipefail
            cd /home/ubuntu/makerskills
            if [ ! -f docker-compose.yml ]; then
              echo "ERROR: /home/ubuntu/makerskills/docker-compose.yml missing"
              exit 1
            fi
            chmod +x deploy/deploy.sh
            ./deploy/deploy.sh
