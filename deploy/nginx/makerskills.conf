# Host-level Nginx virtual host for Maker Skills
# Install on VPS as:
#   /etc/nginx/sites-available/makerskills.tn
#   ln -s /etc/nginx/sites-available/makerskills.tn /etc/nginx/sites-enabled/
#
# Do NOT modify /etc/nginx/sites-enabled/roundeguard.com
#
# After DNS points here, obtain TLS with:
#   sudo certbot --nginx -d www.makerskills.tn -d makerskills.tn

upstream makerskills_frontend {
    server 127.0.0.1:3100;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.makerskills.tn makerskills.tn;

    client_max_body_size 50m;

    location / {
        proxy_pass http://makerskills_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}

