server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    # Backend API (NestJS) — same-origin proxy; backend stays on Docker network only
    location ^~ /auth { proxy_pass http://backend:3020; include /etc/nginx/conf.d/proxy_params.inc; }
    location ^~ /products { proxy_pass http://backend:3020; include /etc/nginx/conf.d/proxy_params.inc; }
    location ^~ /categories { proxy_pass http://backend:3020; include /etc/nginx/conf.d/proxy_params.inc; }
    location ^~ /projects { proxy_pass http://backend:3020; include /etc/nginx/conf.d/proxy_params.inc; }
    location ^~ /services { proxy_pass http://backend:3020; include /etc/nginx/conf.d/proxy_params.inc; }
    location ^~ /events { proxy_pass http://backend:3020; include /etc/nginx/conf.d/proxy_params.inc; }
    location ^~ /participants { proxy_pass http://backend:3020; include /etc/nginx/conf.d/proxy_params.inc; }
    location ^~ /partners { proxy_pass http://backend:3020; include /etc/nginx/conf.d/proxy_params.inc; }
    location ^~ /reviews { proxy_pass http://backend:3020; include /etc/nginx/conf.d/proxy_params.inc; }
    location ^~ /blogs { proxy_pass http://backend:3020; include /etc/nginx/conf.d/proxy_params.inc; }
    location ^~ /hero-section { proxy_pass http://backend:3020; include /etc/nginx/conf.d/proxy_params.inc; }
    location ^~ /orders { proxy_pass http://backend:3020; include /etc/nginx/conf.d/proxy_params.inc; }
    location ^~ /static { proxy_pass http://backend:3020; include /etc/nginx/conf.d/proxy_params.inc; }
    location ^~ /upload { proxy_pass http://backend:3020; include /etc/nginx/conf.d/proxy_params.inc; }
    location ^~ /uploads { proxy_pass http://backend:3020; include /etc/nginx/conf.d/proxy_params.inc; }
    location ^~ /laboratories { proxy_pass http://backend:3020; include /etc/nginx/conf.d/proxy_params.inc; }
    location = /sitemap.xml { proxy_pass http://backend:3020; include /etc/nginx/conf.d/proxy_params.inc; }
    location = /health { proxy_pass http://backend:3020; include /etc/nginx/conf.d/proxy_params.inc; }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
